name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available Xcodes:"
          ls /Applications | grep -i xcode || true
          CANDIDATES=(
            "/Applications/Xcode-26.app"
            "/Applications/Xcode_26.app"
            "/Applications/Xcode.app"
          )
          SELECTED=""
          for c in "${CANDIDATES[@]}"; do
            if [[ -d "$c" ]]; then SELECTED="$c"; break; fi
          done
          if [[ -z "$SELECTED" ]]; then
            SELECTED="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [[ -z "$SELECTED" ]]; then
            echo "No Xcode found" >&2
            exit 1
          fi
          echo "Using $SELECTED"
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks || true
          if ! xcodebuild -showsdks | grep -q "iphoneos26"; then
            echo "::warning::iphoneos26 SDK no encontrado en este runner."
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -euo pipefail
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project AlertaCL.xcodeproj \
            -scheme AlertaCL \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          chmod +x scripts/package-ipa.sh
          ./scripts/package-ipa.sh build/DerivedData

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlertaCL-unsigned-ipa
          path: dist/AlertaCL-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'sideload' }}
          name: AlertaCL sideload IPA
          body: |
            ## AlertaCL — IPA sin firmar

            1. Descarga `AlertaCL-unsigned.ipa`
            2. Ábrelo en **Sideloadly**
            3. Conectá tu iPhone e iniciá sesión con tu Apple ID
            4. Install

            Página con QR: https://joacoorandom.github.io/AlertaCL/

            **Nota:** Critical Alerts de Apple no aplican en sideload sin entitlement.
            iOS 26+ recomendado (Liquid Glass).
          files: dist/AlertaCL-unsigned.ipa
          draft: false
          generate_release_notes: true
          make_latest: true

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate download page + QR
        run: python3 scripts/generate-download-page.py --repo "${{ github.repository }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
